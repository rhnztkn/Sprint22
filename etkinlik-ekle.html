<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Ekle</title>
    <link rel="stylesheet" href="css/2416501017.css">
</head>
<body>
    <header>
        <h1>Etkinlik Ekle</h1>
        <nav>
            <ul>
                <li><a href="index.html">Ana Sayfa</a></li>
                <li><a href="etkinlikler.html">Etkinlikler</a></li>
                <li><a href="etkinlik-ekle.html">Ekle</a></li>
                <li><a href="etkinlik-guncelle.html">Güncelle</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="etkinlik-adi">Etkinlik adı</label>
                <input type="text" id="etkinlik-adi" required placeholder="Etkinlik adını giriniz">
            </div>

            <div class="form-group">
                <label for="kategori">Kategori</label>
                <select id="kategori" required>
                    <option value="">Seçiniz ▾</option>
                    <option value="seminer">Seminer</option>
                    <option value="atolye">Atölye</option>
                    <option value="soylesi">Söyleşi</option>
                </select>
            </div>

            <div class="form-group">
                <label for="tarih">Tarih</label>
                <!-- required yapılarak boş gönderildiğinde hata vermesi sağlandı -->
                <input type="date" id="tarih" required class="has-error">
                <span class="error-message">Bu alan boş bırakılamaz.</span>
            </div>

            <div class="form-group">
                <label for="aciklama">Açıklama</label>
                <textarea id="aciklama" rows="4"></textarea>
            </div>

            <button type="submit" class="btn">Kaydet</button>
        </form>
    </main>
</body>
</html>
