<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Güncelle</title>
    <link rel="stylesheet" href="css/2416501017.css">
</head>
<body>
    <header>
        <h1>Etkinlik Güncelle</h1>
        <nav>
            <ul>
                <li><a href="index.html">Ana Sayfa</a></li>
                <li><a href="etkinlikler.html">Etkinlikler</a></li>
                <li><a href="etkinlik-ekle.html">Ekle</a></li>
                <li><a href="etkinlik-guncelle.html">Güncelle</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="etkinlik-adi">Etkinlik adı</label>
                <input type="text" id="etkinlik-adi" value="Kariyer Günleri 2026" required>
            </div>

            <div class="form-group">
                <label for="kategori">Kategori</label>
                <select id="kategori" required>
                    <option value="seminer" selected>Seminer</option>
                    <option value="atolye">Atölye</option>
                    <option value="soylesi">Söyleşi</option>
                </select>
            </div>

            <div class="form-group">
                <label for="tarih">Tarih</label>
                <input type="text" id="tarih" value="12.10.2026" required>
            </div>

            <div class="form-group">
                <label for="aciklama">Açıklama</label>
                <textarea id="aciklama" rows="4">Mezun söyleşileri</textarea>
            </div>

            <button type="submit" class="btn">Güncelle</button>
        </form>
    </main>
</body>
</html>
